<html>
  <head>
    <title>Theme C - Olympic Style</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/themes/events-base.css">
    <link rel="stylesheet" href="../css/themes/theme-c.css">
  </head>
  <body>
    <section class="event-shell">
      <header class="event-top">
        <img class="brand-logo" src="../img/logo_fai_01_rgb.jpg" alt="MultiGP logo">
        <div class="event-meta">
          <h1 class="event-title">European Championships</h1>
          <p class="event-subtitle">MultiGP Event Layout · Theme C</p>
        </div>
        <img class="sub-logo" src="../img/fai-f9u.png" alt="FAI F9U logo">
      </header>
      <main class="event-main">
        <div class="event-hero">
          <img class="event-logo" src="https://www.multigp.com/wp-content/uploads/2026/06/Logo-Eu-Champs-MultiGPx-1024x727.webp" onerror="this.onerror=null;this.src='../img/eurochamps-on-white-500px.png'" alt="EU Champs Event Logo">
        </div>
        <aside class="event-side">
          <article class="card"><h3>Round</h3><p>Finals · Heat 3</p></article>
          <article class="card"><h3>Schedule</h3><p>Saturday · 15:30 CET</p></article>
          <article class="card"><h3>Featured Pilots</h3><ul><li>Top Seed #1</li><li>Top Seed #2</li><li>Top Seed #3</li></ul></article>
        </aside>
      </main>
      <footer class="event-bottom">
        <span class="badge">@MultiGP</span>
        <span class="event-status">Live Soon</span>
        <span class="badge">#EUChamps</span>
      </footer>
    </section>
  </body>
</html>
